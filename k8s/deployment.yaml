apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flipkart-app
  template:
    metadata:
      labels:
        app: flipkart-app
    spec:
      containers:
        - name: flipkart-app
          image: docker.io/devopsbyrushi/octsecurebankcicdpipleline:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
